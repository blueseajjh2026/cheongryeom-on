ber-card.me{border:2px solid #1687b4;background:#f2fbff}.demo-member-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.demo-member-card p{font-size:12px;line-height:1.7;margin:7px 0}.demo-kv{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;font-size:12px;margin-top:8px}.demo-kv b{color:#2c5a70}.demo-callout{padding:12px;border-left:5px solid #0b7ca7;background:#f0f8fb;margin:12px 0;font-size:12px;line-height:1.7}.demo-callout.warn{border-left-color:#bf7422;background:#fff6eb}.demo-actions-inline{display:flex;gap:7px;flex-wrap:wrap}.demo-actions-inline button{border:1px solid #c9dbe4;background:#fff;border-radius:6px;padding:8px 10px;font-weight:900;font-size:11px}.demo-actions-inline button.sel{background:#0b719d;color:#fff;border-color:#0b719d}.demo-vendor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.demo-vendor{border:1px solid #d4e1e7;padding:10px;background:#fff;border-radius:7px}.demo-vendor b{display:block;color:#194f69}.demo-vendor small{display:block;margin-top:4px;color:#617985}.demo-vendor.sel{border:2px solid #1686b4;background:#eef9fd}.demo-char-count{font-weight:900}.demo-char-count.ok{color:#247457}.demo-char-count.bad{color:#ae551a}.demo-panel-card{border:1px solid #d6e2e8;padding:12px;border-radius:8px;margin:10px 0;background:#fff}.demo-panel-speech{background:#eef8fd;border:1px solid #bfdce9;padding:10px 11px;border-radius:10px;margin:8px 0;font-size:12px;line-height:1.65}.demo-range-row{display:grid;grid-template-columns:120px 1fr 54px;gap:8px;align-items:center;margin:7px 0;font-size:11px}.demo-range-row input{width:100%}.demo-result-hero{text-align:center;padding:12px}.demo-result-hero strong{font-size:46px;color:#0b719d}.demo-certificate{border:3px double #b58c33;background:#fffdf6;padding:22px 14px;text-align:center;margin-top:14px}.demo-certificate h2{font-size:28px;color:#7f5d17;margin:8px}.demo-certificate .q{font-size:18px;font-weight:950}.demo-certificate p{font-size:11px;line-height:1.7}.demo-track-badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eaf6fb;color:#086e9a;font-size:11px;font-weight:900}.demo-wait{padding:14px;border:1px dashed #aac7d4;background:#f8fbfc;text-align:center;font-size:12px}.demo-practical-next{margin-top:12px}.demo-hidden{display:none!important}@media(max-width:430px){.demo-mini-steps{grid-template-columns:repeat(2,1fr)}.demo-vendor-grid{grid-template-columns:1fr}.demo-range-row{grid-template-columns:100px 1fr 46px}.demo-ribbon-in{gap:6px}.demo-ribbon .spacer{display:none}.demo-ribbon a,.demo-ribbon button{padding:6px 8px}}

<body class="app-body student-page">
<div class="demo-ribbon"><div class="demo-ribbon-in"><b>심사위원 학생용 실전 체험</b><span>실제 v8.6.1 콘텐츠·채점 로직 사용 / Firebase 저장 없음</span><div class="spacer"></div><a href="judge-demo.html">통합안내</a><a href="teacher-demo.html">교사용 데모</a></div></div>
<header class="app-top student-top"><div class="app-top-inner"><a href="judge-demo.html"><img class="app-logo" src="assets/official/ci-education.png" alt="국가청렴권익교육원"></a><span class="status-pill">DEMO · 실전형</span></div></header>
<div class="student-accessibility-bar" aria-label="화면 확대 설정"><span>화면 확대</span><div class="student-zoom-controls"><button type="button" data-zoom="1">100%</button><button type="button" data-zoom="1.1">110%</button><button type="button" data-zoom="1.2">120%</button></div></div>
<main class="student-shell">
<div class="demo-mode-note"><b>심사·시연용 독립 체험모드</b><br>실제 수업에서는 교사가 단계를 제어하고 학생별 응답이 실시간 저장됩니다. 이 데모에서는 같은 화면과 콘텐츠를 휴대폰 한 대에서 끝까지 직접 체험할 수 있습니다.</div>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ROOT=window.CHEONGRYEOM_CONTENT;
let trackKey='', C=null, stage='join', writtenIndex=0, practicalIndex=0, teamPhase=0;
const A={written:{},practical:{},team:{role:null,report:null},pledge:''};
const drafts={};
const virtueNames=Object.fromEntries(ROOT.virtues.map(v=>[v.key,v.name]));
const stages=['intro','written','writtenFeedback','practical','practicalFeedback','team','diagnosis','pledge','result'];
const stageLabel={intro:'전공별 오리엔테이션',written:'전공맞춤 필기평가',writtenFeedback:'필기 결과·1차 피드백',practical:'전공맞춤 작업형 실기',practicalFeedback:'실기 결과·종합평가 안내',team:'전공맞춤 직무상황 종합평가',diagnosis:'역량진단',pledge:'직업윤리 실천',result:'자격판정'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function trackPicker(){return `<div class="student-header-grid"><div><span class="eyebrow">VOCATIONAL INTEGRITY QUALIFICATION</span><h1>예비 직업인의 이름으로<br>직업윤리 자격에 도전합니다.</h1><p class="helper">심사위원 체험에서는 개인정보를 저장하지 않습니다. 전공을 선택하면 실제 학생용과 동일한 전공맞춤 문항이 열립니다.</p></div><div class="student-character"><img class="official-character" src="assets/official/character-greeting.png" alt="인사하는 국민권익위원회 캐릭터"></div></div><label>체험자 이름</label><input id="demoName" value="심사위원 체험" readonly><label>나의 전공분야</label><div class="track-choice-guide"><b>내 학과와 가장 유사한 분야를 1개 선택하세요.</b><span>정확히 일치하는 분야가 없으면 배우는 내용과 취업 직무가 가장 가까운 분야를 선택하면 됩니다.</span></div><div class="track-picker">${ROOT.trackList.map(t=>`<label class="track-option"><input type="radio" name="trackKey" value="${t.key}"><span><b>${t.icon} ${t.name}</b><small>${t.departments}</small></span></label>`).join('')}</div><div class="track-source-note">※ HIFIVE 학교별 학과정보를 직무 유사성에 따라 청렴ON 교육용 5개 분야로 재구성했습니다.</div><button id="startDemo" class="btn primary large full" style="margin-top:14px" disabled>수험등록 후 실전 체험 시작</button>`}
function init(){ $('#joinPanel').innerHTML=trackPicker(); $$('input[name=trackKey]').forEach(r=>r.onchange=()=>{$('#startDemo').disabled=false}); $('#startDemo').onclick=()=>{trackKey=$('input[name=trackKey]:checked').value;C=ROOT.tracks[trackKey];stage='intro';$('#joinPanel').classList.add('hidden');$('#examPanel').classList.remove('hidden');render();}; $$('[data-zoom]').forEach(b=>b.onclick=()=>setZoom(Number(b.dataset.zoom))); setZoom(1);}
function setZoom(z){document.documentElement.style.setProperty('--demoZoom',z);document.querySelector('.student-shell').style.zoom=z;$$('[data-zoom]').forEach(b=>b.classList.toggle('active',Number(b.dataset.zoom)===z));}
function progress(){const i=Math.max(0,stages.indexOf(stage));const p=Math.round((i+1)/stages.length*100);$('#studentStage').textContent=stageLabel[stage]||'체험';$('#studentPct').textContent=p+'%';$('#studentBar').style.width=p+'%';}
function stageControls(extra=''){const i=stages.indexOf(stage);let left=i>0?'<button id="demoPrev" class="btn outline">← 이전 단계</button>':'<button class="btn outline" disabled>← 이전 단계</button>';let right=i<stages.length-1?'<button id="demoNext" class="btn primary">다음 단계 →</button>':'<button id="demoRestart" class="btn primary">처음부터 다시</button>';$('#demoStageControl').innerHTML=left+extra+right;if($('#demoPrev'))$('#demoPrev').onclick=()=>goStage(-1);if($('#demoNext'))$('#demoNext').onclick=()=>goStage(1);if($('#demoRestart'))$('#demoRestart').onclick=()=>location.reload();}
function goStage(d){let i=stages.indexOf(stage)+d;i=Math.max(0,Math.min(stages.length-1,i));stage=stages[i];if(stage==='written'&&d>0)writtenIndex=0;if(stage==='practical'&&d>0)practicalIndex=0;if(stage==='team'&&d>0)teamPhase=0;render();scrollTo(0,0)}
function choiceButtons(opts,sel,prefix){return `<div class="choice-list">${opts.map((o,i)=>`<button class="choice-btn ${sel===i?'selected':''}" data-${prefix}="${i}"><span>${i+1}</span><b>${esc(o)}</b></button>`).join('')}</div>`}
function writtenComp(){const sums=Object.fromEntries(ROOT.virtues.map(v=>[v.key,{s:0,n:0}]));C.written.forEach(q=>{const a=A.written[q.id];if(!a)return;Object.entries(q.impact||{}).forEach(([k,v])=>{sums[k].s+=(a.choice===q.correct?v:Math.round(v*.3));sums[k].n++;});});return Object.fromEntries(Object.entries(sums).map(([k,v])=>[k,v.n?Math.round(v.s/v.n):0]));}
function feedbackBars(values){return `<div class="written-feedback-bars">${ROOT.virtues.map(v=>{const x=values[v.key]||0;return `<div class="written-feedback-row"><div><b>${v.name}</b><span>${v.tag}</span></div><div class="written-feedback-track"><i style="width:${x}%"></i></div><strong>${x}</strong></div>`}).join('')}</div>`}
const wCoach={honesty:'실기에서는 실제 수치·기록·사실을 바꾸지 않고 그대로 확인·보고하는 데 집중해보세요.',promise:'실기에서는 시간이 촉박해도 정해진 절차·기한·안전기준을 먼저 확인해보세요.',care:'실기에서는 내 선택이 동료·고객·사용자·생명·환경에 어떤 영향을 주는지도 함께 살펴보세요.',responsibility:'실기에서는 문제를 발견하는 데서 끝내지 말고 보고·조치·기록까지 완성해보세요.',restraint:'실기에서는 친분·선물·개인 편의와 같은 사적 요소를 직무판단에서 분리해보세요.',fairness:'실기에서는 누구에게나 설명할 수 있는 공개된 기준을 먼저 세우고 같은 방식으로 적용해보세요.'};
const pCoach={honesty:'종합평가에서는 다른 사람의 정보와 새 조건이 생겨도 사실·수치·기록을 정확히 구분해 판단해보세요.',promise:'종합평가에서는 팀 의견보다 먼저 납기·안전·보안·위생처럼 반드시 지켜야 할 기준을 찾아보세요.',care:'종합평가에서는 내 직무뿐 아니라 다른 부서·고객·사용자에게 미칠 영향까지 함께 비교해보세요.',responsibility:'종합평가에서는 문제를 발견한 뒤 질문하고, 새 정보를 반영하고, 최종 근거까지 남기는 흐름을 완성해보세요.',restraint:'종합평가에서는 친분·상급자 선호·개인 편의가 팀 판단에 섞이지 않도록 공개된 기준과 분리해보세요.',fairness:'종합평가에서는 조원 의견이 달라도 공개된 기준을 동일하게 적용하고, 왜 판단을 바꿨는지 설명해보세요.'};
function renderIntro(){return `<span class="stage-tag">전공별 오리엔테이션</span><div class="my-track-banner"><b>${C.icon} ${C.name}</b><span>${C.departments}</span></div><h2>${C.intro.title}</h2><div class="student-context">${C.intro.body}</div><div class="student-virtues">${ROOT.virtues.map(v=>`<div class="student-virtue"><b>${v.name}</b><span>${v.tag}<br>${v.desc}</span></div>`).join('')}</div><div class="demo-callout"><b>실제 수업에서는</b><br>교사가 오리엔테이션을 종료하면 모든 학생 화면이 동시에 필기평가로 전환됩니다.</div>`}
function renderWritten(){const q=C.written[writtenIndex],a=A.written[q.id];return `<span class="stage-tag">필기평가 ${writtenIndex+1}/${C.written.length}</span><div class="demo-track-badge">${C.icon} ${C.name}</div><h2>${q.q}</h2>${choiceButtons(q.options,a?.choice,'wchoice')}${a?`<div class="feedback ${a.choice===q.correct?'good':'info'}"><b>${a.choice===q.correct?'정답입니다.':'해설을 확인해보세요.'}</b><br>${q.ex}</div><button id="nextWritten" class="btn primary large full">${writtenIndex===C.written.length-1?'필기 결과·1차 피드백 보기':'다음 필기문항 →'}</button>`:`<button id="submitWritten" class="btn primary large full" disabled>답안 제출</button>`}`}
function bindWritten(){const q=C.written[writtenIndex];let pending=A.written[q.id]?.choice??null;$$('[data-wchoice]').forEach(b=>b.onclick=()=>{pending=Number(b.dataset.wchoice);$$('[data-wchoice]').forEach(x=>x.classList.toggle('selected',Number(x.dataset.wchoice)===pending));$('#submitWritten').disabled=false;});if($('#submitWritten'))$('#submitWritten').onclick=()=>{A.written[q.id]={choice:pending};render();};if($('#nextWritten'))$('#nextWritten').onclick=()=>{if(writtenIndex<C.written.length-1){writtenIndex++;render();}else{stage='writtenFeedback';render();}scrollTo(0,0)};}
function renderWrittenFeedback(){const vals=writtenComp();const ranked=ROOT.virtues.map(v=>({...v,score:vals[v.key]||0})).sort((a,b)=>b.score-a.score);const correct=C.written.filter(q=>A.written[q.id]?.choice===q.correct).length;const strengths=ranked.slice(0,2),growth=ranked.at(-1);return `<span class="stage-tag">필기평가 완료 · 1차 피드백</span><div class="written-feedback-hero"><div><span>WRITTEN → PRACTICAL</span><h2>필기는 끝났습니다.<br>이제 <em>직접 처리하는 실기</em>로 넘어갑니다.</h2><p>필기에서 드러난 6대 청렴역량을 잠깐 확인하고, 다음 작업에서 무엇을 의식할지 정리해보세요.</p></div><div class="written-result-ring"><b>${correct}</b><span>/ ${C.written.length} 정답</span></div></div>${feedbackBars(vals)}<div class="written-feedback-cards"><article class="written-strength"><span>✓ 잘하고 있어요</span><h3>${strengths.map(x=>`${x.name} ${x.score}`).join(' · ')}</h3><p>${strengths[0]?.desc||''}</p></article><article class="written-growth"><span>→ 실기에서 더 연습해볼 점</span><h3>${growth.name} ${growth.score}</h3><p>${wCoach[growth.key]}</p></article></div><div class="written-to-practical"><b>화면 전환 안내</b><div><span><strong>필기</strong> 상황을 읽고 보기에서 판단</span><em>→</em><span><strong>실기</strong> 지급자료 확인 → 기준 설정 → 실제 처리 → 기록 제출</span></div><small>이 데모에서는 아래 ‘다음 단계’를 누르면 작업형 실기로 이동합니다.</small></div>`}
function draft(q){if(drafts[q.id])return drafts[q.id];if(q.kind==='procurement')drafts[q.id]={openedDocs:[],activeDoc:null,conflictVendor:'',criteria:[],selectedVendor:null,disclosure:null,reason:''};else if(q.kind==='sequence')drafts[q.id]={order:[],note:''};else{const scores={};q.candidates.forEach(c=>{scores[c.id]={};q.rubricFields.forEach(f=>scores[c.id][f.key]=0)});drafts[q.id]={scores,lockedScores:null,revealed:false,response:null,reason:''};}return drafts[q.id];}
function scoreTable(ev,title){return `<div class="demo-score-table"><header><b>${title}</b><strong>${ev.score}점</strong></header>${(ev.details||[]).map(d=>`<div class="demo-score-row"><span>${d[0]}</span><strong>${d[1]} / ${d[2]}</strong></div>`).join('')}</div>`}
function renderP1(q,d,done){const active=q.docs.find(x=>x.id===d.activeDoc);return `<span class="stage-tag">작업형 실기 ${practicalIndex+1}/3 · ${q.code}</span><h2>${q.title}</h2><div class="student-context">${q.context}</div><section class="practical-block"><h3>① 지급자료 확인</h3><div class="practical-docs">${q.docs.map(x=>`<button class="doc-card ${d.openedDocs.includes(x.id)?'opened':''}" data-doc="${x.id}"><b>${x.icon} ${x.title}</b><span>${d.openedDocs.includes(x.id)?'열람 완료':'눌러서 열람'}</span></button>`).join('')}</div><div class="student-context">${active?active.body:'자료를 눌러 내용을 확인하세요.'}</div></section><section class="practical-block"><h3>② 이해관계 확인</h3><div class="demo-actions-inline">${q.vendors.map(v=>`<button data-conf="${v.id}" class="${d.conflictVendor===v.id?'sel':''}">${v.name}</button>`).join('')}<button data-conf="NONE" class="${d.conflictVendor==='NONE'?'sel':''}">없음</button></div></section><section class="practical-block"><h3>③ 비교기준 설정</h3><div class="required-note ${d.criteria.length>=2?'ok':''}">※ 필수 · 비교기준을 <b>2개 이상</b> 선택하세요. 현재 ${d.criteria.length}개</div><div class="demo-actions-inline">${q.criteria.map(c=>`<button data-crit="${c.key}" class="${d.criteria.includes(c.key)?'sel':''}">${c.label}</button>`).join('')}</div></section><section class="practical-block"><h3>④ 최종 업무처리</h3><div class="demo-vendor-grid">${q.vendors.map((v,i)=>`<button class="demo-vendor ${d.selectedVendor===i?'sel':''}" data-vendor="${i}"><b>${v.name}</b><small>${v.price} · ${v.quality} · ${v.delivery}</small></button>`).join('')}</div><label>이해관계 공개·기록</label><div class="demo-actions-inline"><button data-disc="1" class="${d.disclosure===true?'sel':''}">공개하고 기록</button><button data-disc="0" class="${d.disclosure===false?'sel':''}">별도 기록 안 함</button></div><label>선정이유 및 처리기록</label><textarea id="pReason" placeholder="가격·품질·납기·이해관계 등을 근거로 작성하세요.">${esc(d.reason)}</textarea><div class="required-note ${d.reason.trim().length>=10?'ok':''}">※ 필수 · 10글자 이상 작성해야 제출할 수 있습니다. <span class="demo-char-count ${d.reason.trim().length>=10?'ok':'bad'}">현재 ${d.reason.trim().length}/10자</span></div></section>${done?scoreTable(done,'P-01 작업결과 채점표'):`<button id="submitPractical" class="btn primary large full">작업물 제출</button>`}`}
function renderP2(q,d,done){const names=Object.fromEntries(q.actions.map(a=>[a.id,a.text]));return `<span class="stage-tag">작업형 실기 ${practicalIndex+1}/3 · ${q.code}</span><h2>${q.title}</h2><div class="student-context">${q.context}</div><section class="practical-block"><h3>① ${q.sequenceLabels.reviewTitle}</h3><div class="ledger-list">${q.ledger.map(x=>`<div class="ledger-row ${x.proof?'':'missing'}"><span>${x.item}</span><b>${x.amount}</b><small>${x.proof?q.sequenceLabels.okText:q.sequenceLabels.missingText}</small></div>`).join('')}</div></section><section class="practical-block"><h3>② ${q.sequenceLabels.orderTitle}</h3><p>${q.sequenceLabels.orderHint}</p><div class="demo-actions-inline">${q.actions.map(a=>`<button data-action="${a.id}" ${d.order.includes(a.id)?'disabled':''}>${a.text}</button>`).join('')}</div><div class="student-context"><b>나의 처리순서</b><br>${d.order.length?d.order.map((x,i)=>`${i+1}. ${names[x]}`).join('<br>'):'아직 선택하지 않았습니다.'}</div><button id="resetOrder" class="btn outline">순서 초기화</button></section><section class="practical-block"><h3>③ ${q.sequenceLabels.noteTitle}</h3><textarea id="pNote" placeholder="${q.sequenceLabels.notePlaceholder}">${esc(d.note)}</textarea><div class="required-note ${d.note.trim().length>=10?'ok':''}">※ 필수 · 10글자 이상 작성하세요. <span class="demo-char-count ${d.note.trim().length>=10?'ok':'bad'}">현재 ${d.note.trim().length}/10자</span></div></section>${done?scoreTable(done,'P-02 작업결과 채점표'):`<button id="submitPractical" class="btn primary large full">작업물 제출</button>`}`}
function renderP3(q,d,done){return `<span class="stage-tag">작업형 실기 ${practicalIndex+1}/3 · ${q.code}</span><h2>${q.title}</h2><div class="student-context">${q.context}</div><div class="demo-callout"><b>${q.panelLabels.criterionTitle}</b><br>${q.panelLabels.criterionHint}</div>${q.candidates.map(c=>`<article class="demo-panel-card"><h3>${c.name}</h3><div class="student-context"><b>${q.panelLabels.materialLabel}</b><br>${c.profile}</div><div class="demo-panel-speech"><b>🎤 ${q.panelLabels.speechLabel}</b><br>“${c.speech}”</div>${q.rubricFields.map(f=>`<div class="demo-range-row"><span>${f.label}</span><input type="range" min="0" max="${f.max}" value="${d.scores[c.id][f.key]}" data-range="${c.id}:${f.key}"><b>${d.scores[c.id][f.key]}/${f.max}</b></div>`).join('')}</article>`).join('')}${!d.revealed?`<button id="revealExtra" class="btn soft large full" ${q.candidates.every(c=>q.rubricFields.every(f=>Number(d.scores[c.id][f.key])>0))?'':'disabled'}>${q.panelLabels.revealButton}</button><div class="required-note ${q.candidates.every(c=>q.rubricFields.every(f=>Number(d.scores[c.id][f.key])>0))?'ok':''}">※ 세 개선안의 모든 평가항목을 1점 이상 채점하면 추가정보를 확인할 수 있습니다.</div>`:`<div class="demo-callout warn"><b>${q.panelLabels.extraTitle}</b><br>${q.extraInfo}</div><section class="practical-block"><h3>${q.panelLabels.decisionTitle}</h3><p>${q.panelLabels.decisionHint}</p>${choiceButtons(q.responses,d.response,'panelresp')}<label>${q.panelLabels.reasonLabel}</label><textarea id="panelReason" placeholder="${q.panelLabels.reasonPlaceholder}">${esc(d.reason)}</textarea><div class="required-note ${d.reason.trim().length>=10?'ok':''}">※ 필수 · 10글자 이상 작성하세요. <span class="demo-char-count ${d.reason.trim().length>=10?'ok':'bad'}">현재 ${d.reason.trim().length}/10자</span></div></section>${done?'':`<button id="submitPractical" class="btn primary large full">작업물 제출</button>`}`}${done?scoreTable(done,'P-03 작업결과 채점표'):''}`}
function practicalReady(q,d){if(q.kind==='procurement')return d.openedDocs.length===q.docs.length&&d.conflictVendor&&d.criteria.length>=2&&Number.isInteger(d.selectedVendor)&&d.disclosure!==null&&d.reason.trim().length>=10;if(q.kind==='sequence')return d.order.length===4&&d.note.trim().length>=10;return d.revealed&&d.response!==null&&d.reason.trim().length>=10;}
function practicalAnswer(q,d){if(q.kind==='procurement')return {work:{openedDocs:d.openedDocs,conflictVendor:d.conflictVendor,criteria:d.criteria,selectedVendor:d.selectedVendor,disclosure:d.disclosure,reason:d.reason.trim()}};if(q.kind==='sequence')return {work:{order:d.order,note:d.note.trim()}};return {work:{scores:d.scores,lockedScores:d.lockedScores||d.scores,revealed:d.revealed,response:d.response,reason:d.reason.trim()}};}
function bindPractical(q,d){$$('[data-doc]').forEach(b=>b.onclick=()=>{d.activeDoc=b.dataset.doc;if(!d.openedDocs.includes(d.activeDoc))d.openedDocs.push(d.activeDoc);render()});$$('[data-conf]').forEach(b=>b.onclick=()=>{d.conflictVendor=b.dataset.conf;render()});$$('[data-crit]').forEach(b=>b.onclick=()=>{const k=b.dataset.crit;d.criteria=d.criteria.includes(k)?d.criteria.filter(x=>x!==k):[...d.criteria,k];render()});$$('[data-vendor]').forEach(b=>b.onclick=()=>{d.selectedVendor=Number(b.dataset.vendor);render()});$$('[data-disc]').forEach(b=>b.onclick=()=>{d.disclosure=b.dataset.disc==='1';render()});if($('#pReason'))$('#pReason').oninput=e=>{d.reason=e.target.value;const n=d.reason.trim().length;const box=e.target.nextElementSibling;box.classList.toggle('ok',n>=10);box.querySelector('.demo-char-count').textContent=`현재 ${n}/10자`;box.querySelector('.demo-char-count').className='demo-char-count '+(n>=10?'ok':'bad');};$$('[data-action]').forEach(b=>b.onclick=()=>{if(d.order.length<4&&!d.order.includes(b.dataset.action)){d.order.push(b.dataset.action);render()}});if($('#resetOrder'))$('#resetOrder').onclick=()=>{d.order=[];render()};if($('#pNote'))$('#pNote').oninput=e=>{d.note=e.target.value;const n=d.note.trim().length;const box=e.target.nextElementSibling;box.classList.toggle('ok',n>=10);box.querySelector('.demo-char-count').textContent=`현재 ${n}/10자`;box.querySelector('.demo-char-count').className='demo-char-count '+(n>=10?'ok':'bad');};$$('[data-range]').forEach(r=>r.oninput=()=>{const [cid,k]=r.dataset.range.split(':');d.scores[cid][k]=Number(r.value);r.nextElementSibling.textContent=`${r.value}/${r.max}`;});if($('#revealExtra'))$('#revealExtra').onclick=()=>{d.revealed=true;d.lockedScores=JSON.parse(JSON.stringify(d.scores));render()};$$('[data-panelresp]').forEach(b=>b.onclick=()=>{d.response=Number(b.dataset.panelresp);render()});if($('#panelReason'))$('#panelReason').oninput=e=>{d.reason=e.target.value;const n=d.reason.trim().length;const box=e.target.nextElementSibling;box.classList.toggle('ok',n>=10);box.querySelector('.demo-char-count').textContent=`현재 ${n}/10자`;box.querySelector('.demo-char-count').className='demo-char-count '+(n>=10?'ok':'bad');};if($('#submitPractical'))$('#submitPractical').onclick=()=>{if(!practicalReady(q,d)){alert('필수 항목을 모두 완료해주세요.');return;}A.practical[q.id]=practicalAnswer(q,d);render();};}
function renderPractical(){const q=C.practical[practicalIndex],d=draft(q),ans=A.practical[q.id],ev=ans?CHEONGRYEOM_EVALUATE_PRACTICAL(q,ans):null;let body=q.kind==='procurement'?renderP1(q,d,ev):q.kind==='sequence'?renderP2(q,d,ev):renderP3(q,d,ev);if(ans)body+=`<button id="nextPractical" class="btn primary large full demo-practical-next">${practicalIndex===2?'실기 결과·2차 피드백 보기':'다음 작업형 실기 →'}</button>`;return body;}
function bindPracticalOuter(){const q=C.practical[practicalIndex],d=draft(q);bindPractical(q,d);if($('#nextPractical'))$('#nextPractical').onclick=()=>{if(practicalIndex<2){practicalIndex++;render()}else{stage='practicalFeedback';render()}scrollTo(0,0)};}
function preTeamComp(){const sums=Object.fromEntries(ROOT.virtues.map(v=>[v.key,{s:0,n:0}]));C.written.forEach(q=>{const a=A.written[q.id];if(!a)return;Object.entries(q.impact||{}).forEach(([k,v])=>{sums[k].s+=(a.choice===q.correct?v:Math.round(v*.3));sums[k].n++})});C.practical.forEach(q=>{const a=A.practical[q.id];if(!a)return;const ev=CHEONGRYEOM_EVALUATE_PRACTICAL(q,a);Object.entries(ev.impact||{}).forEach(([k,v])=>{if(sums[k]){sums[k].s+=v;sums[k].n++}})});return Object.fromEntries(Object.entries(sums).map(([k,v])=>[k,v.n?Math.round(v.s/v.n):0]));}
function renderPracticalFeedback(){const tasks=C.practical.map(q=>{const a=A.practical[q.id],ev=a?CHEONGRYEOM_EVALUATE_PRACTICAL(q,a):{score:0,details:[]};return {q,score:ev.score,details:ev.details||[]}});const avg=Math.round(tasks.reduce((s,x)=>s+x.score,0)/3);const vals=preTeamComp();const ranked=ROOT.virtues.map(v=>({...v,score:vals[v.key]||0})).sort((a,b)=>b.score-a.score);const strengths=ranked.slice(0,2),growth=ranked.at(-1);return `<span class="stage-tag">작업형 실기 완료 · 2차 피드백</span><div class="practical-feedback-hero"><div><span>PRACTICAL → TEAM PRACTICAL</span><h2>개인 실기는 끝났습니다.<br>이제 <em>함께 판단하는 종합평가</em>로 넘어갑니다.</h2><p>세 작업에서 어떤 수행이 강했고, 다음 팀 의사결정에서 무엇을 더 의식하면 좋을지 확인해보세요.</p></div><div class="practical-result-ring"><b>${avg}</b><span>실기 평균</span><small>3/3 제출</small></div></div><div class="practical-feedback-tasks">${tasks.map((x,i)=>`<article class="done"><span>P-0${i+1}</span><b>${x.score}</b><small>100점 기준</small></article>`).join('')}</div><div class="feedback-section-label"><b>필기 + 개인실기 반영 · 2차 청렴역량</b><span>최종 점수는 종합평가까지 마친 뒤 다시 산출됩니다.</span></div>${feedbackBars(vals)}<div class="written-feedback-cards"><article class="written-strength"><span>✓ 실기에서 잘하고 있어요</span><h3>${strengths.map(x=>`${x.name} ${x.score}`).join(' · ')}</h3><p>작업자료를 확인하고 기준에 따라 판단·기록하는 수행이 안정적이었습니다.</p></article><article class="written-growth"><span>→ 종합평가에서 더 해볼 점</span><h3>${growth.name} ${growth.score}</h3><p>${pCoach[growth.key]}</p></article></div><section class="team-transition-explainer"><div class="team-transition-title"><span>다음 평가</span><h3>전공맞춤 직무상황 종합평가</h3><p>이번에는 혼자 정답을 찾는 문제가 아닙니다. <b>각자 다른 직무정보를 분석하고, 디지털 상황판에서 서로의 판단을 합쳐 최종 결정을 만드는 평가</b>입니다.</p></div><div class="team-how-grid"><article><b>① 팀·역할 확인</b><span>같은 전공 3~5명 중심 랜덤팀 · 부족 역할은 겸임자료 자동배정</span></article><article><b>② 내 직무 분석</b><span>핵심정보 · 위험도 · 1차추천 · 근거 · 다른 담당자에게 할 질문 제출</span></article><article><b>③ 팀 상황판 교차검증</b><span>자리 이동 없이 조원의 근거와 질문이 내 휴대폰에 자동으로 모임</span></article><article><b>④ 돌발상황 재판단</b><span>새 조건이 공개되면 처음 생각을 고집하지 말고 근거를 다시 검토</span></article><article><b>⑤ 전원 최종의견</b><span>서기만 제출하지 않고 모든 조원이 직접 최종판단과 근거를 제출</span></article></div><div class="team-no-move-notice"><b>📱 자리 이동은 필요 없습니다.</b><span>교사가 단계별로 화면을 열면 각 자리에서 같은 팀의 정보가 자동 공유됩니다.</span></div></section>`}
const people=[{uid:'me',name:'심사위원 체험',role:'purchase'},{uid:'u1',name:'김하린',role:'records',extra:'verify'},{uid:'u2',name:'이도윤',role:'finance'},{uid:'u3',name:'박서준',role:'operations'}];
function simAnswers(){const team=C.team;const out={};for(const p of people){const r=team.roles[p.role];if(p.uid==='me'&&A.team.role){out[p.uid]=A.team.role;continue;}out[p.uid]={choice:r.correct,work:{roleKey:p.role,riskLevel:p.role==='finance'?'보통':'높음',preliminaryVendor:p.role==='operations'?team.vendors[0].id:team.vendors[1].id,note:p.role==='records'?`이해관계를 공개하고 같은 기준과 변경사유를 기록해야 합니다.`:p.role==='finance'?`예산 범위 안이므로 비용만 보지 말고 다른 직무조건도 비교해야 합니다.`:p.role==='operations'?`필수 마감시간을 넘기면 현장 운영이 불가능하므로 납기를 우선 확인해야 합니다.`:`가격·품질·납기를 같은 기준으로 비교하고 다른 담당자 정보도 확인해야 합니다.`,question:p.role==='records'?`구매 담당에게 실제 납기와 품질조건을 확인하겠습니다.`:p.role==='finance'?`업무운영 담당에게 반드시 지켜야 할 마감시각을 묻겠습니다.`:p.role==='operations'?`기록 담당에게 이해관계 공개 절차를 확인하겠습니다.`:`기록 담당에게 이해관계 여부와 처리기준을 확인하겠습니다.`}}}return out;}
function teamSteps(){const labs=['① 내 직무분석','② 팀 상황판','③ 돌발상황','④ 최종판단','⑤ 결과'];return `<div class="demo-mini-steps">${labs.map((x,i)=>`<span class="${i<teamPhase?'done':i===teamPhase?'on':''}">${i<teamPhase?'✓ ':''}${x}</span>`).join('')}</div>`}
function roleReady(){const w=A.team.role?.work||{};return A.team.role&&w.riskLevel&&w.preliminaryVendor&&String(w.note||'').trim().length>=15&&String(w.question||'').trim().length>=8;}
function renderTeam(){const t=C.team,role=t.roles.purchase;let h=`<span class="stage-tag">전공맞춤 직무상황 종합평가</span><div class="my-track-banner"><b>${C.icon} ${t.title}</b><span>${t.context}</span></div>${teamSteps()}`;if(teamPhase===0){const cur=A.team.role||{choice:null,work:{roleKey:'purchase',riskLevel:'',preliminaryVendor:'',note:'',question:''}};h+=`<div class="demo-callout"><b>랜덤 편성 결과 · ${C.short} 2팀</b><br>김하린 · 서기(기록·조정)+검증 겸임 / 이도윤 · 회계 담당 / <b>심사위원 체험 · ${role.name}</b> / 박서준 · 업무운영 담당<br><small>※ 4명 팀이므로 검증 역할은 서기가 겸임합니다. 실제 수업에서는 3~5명에 맞춰 부족 역할 자료가 자동 보완됩니다.</small></div><h2>${role.icon} 나의 직무 · ${role.name}</h2><div class="student-context">${role.secret}</div><h3>① 핵심정보 해석</h3>${choiceButtons(role.options,cur.choice,'rolechoice')}<h3>② 위험도 판단</h3><div class="demo-actions-inline">${['낮음','보통','높음'].map(x=>`<button data-risk="${x}" class="${cur.work.riskLevel===x?'sel':''}">${x}</button>`).join('')}</div><h3>③ 1차 추천 대안</h3><div class="demo-actions-inline">${t.vendors.map(v=>`<button data-pre="${v.id}" class="${cur.work.preliminaryVendor===v.id?'sel':''}">${v.id} · ${v.name}</button>`).join('')}<button data-pre="HOLD" class="${cur.work.preliminaryVendor==='HOLD'?'sel':''}">판단 보류</button></div><label>④ 내 직무의 핵심근거</label><textarea id="roleNote">${esc(cur.work.note)}</textarea><div class="required-note ${String(cur.work.note).trim().length>=15?'ok':''}">15글자 이상 · 현재 ${String(cur.work.note).trim().length}/15자</div><label>⑤ 다른 직무 담당자에게 확인할 질문</label><textarea id="roleQuestion">${esc(cur.work.question)}</textarea><div class="required-note ${String(cur.work.question).trim().length>=8?'ok':''}">8글자 이상 · 현재 ${String(cur.work.question).trim().length}/8자</div><button id="submitRole" class="btn primary large full">개인 직무분석 제출</button>`;}else if(teamPhase===1||teamPhase===2){const sim=simAnswers();h+=`<h2>LIVE 팀 상황판 · 자리 이동 없이 교차검증</h2><div class="demo-board">${people.map(p=>{const a=sim[p.uid],r=t.roles[p.role],w=a.work;const v=t.vendors.find(x=>x.id===w.preliminaryVendor);return `<article class="demo-member-card ${p.uid==='me'?'me':''}"><div class="demo-member-head"><b>${p.name} · ${r.name}${p.extra?' + 검증 겸임':''}</b><span class="demo-track-badge">${w.riskLevel}</span></div><div class="demo-kv"><b>1차 추천</b><span>${w.preliminaryVendor==='HOLD'?'판단 보류':`${v?.id||''} · ${v?.name||''}`}</span><b>핵심근거</b><span>${esc(w.note)}</span><b>확인질문</b><span>${esc(w.question)}</span></div></article>`}).join('')}</div>`;if(teamPhase===2)h+=`<div class="demo-callout warn"><b>⚠️ 돌발상황 공개</b><br>${t.twist}</div><p class="student-context">처음 판단과 달라져도 괜찮습니다. 새 정보와 다른 직무의 정보를 반영해 다시 판단하는 과정 자체가 평가됩니다.</p>`;}else if(teamPhase===3){const r=A.team.report||{work:{issues:[],criteria:[],conflictResponse:null,twistResponse:null,vendor:'',influenceUid:'',reason:''}};const w=r.work;h+=`<h2>전원 최종위원 판단</h2><div class="demo-callout warn"><b>돌발상황</b><br>${t.twist}</div><h3>① 핵심 문제 발견</h3><div class="demo-actions-inline">${t.issues.map(x=>`<button data-issue="${x.key}" class="${w.issues.includes(x.key)?'sel':''}">${x.label}</button>`).join('')}</div><h3>② 판단기준 설정</h3><div class="demo-actions-inline">${t.criteria.map(x=>`<button data-tcrit="${x.key}" class="${w.criteria.includes(x.key)?'sel':''}">${x.label}</button>`).join('')}</div><h3>③ 이해관계 처리</h3>${choiceButtons(t.conflictResponses,w.conflictResponse,'confresp')}<h3>④ 돌발상황 반영</h3>${choiceButtons(t.twistResponses,w.twistResponse,'twistresp')}<h3>⑤ 내 판단에 가장 영향을 준 조원정보</h3><div class="demo-actions-inline">${people.filter(p=>p.uid!=='me').map(p=>`<button data-influence="${p.uid}" class="${w.influenceUid===p.uid?'sel':''}">${p.name} · ${t.roles[p.role].name}</button>`).join('')}</div><h3>⑥ 최종 대안</h3><div class="demo-vendor-grid">${t.vendors.map(v=>`<button class="demo-vendor ${w.vendor===v.id?'sel':''}" data-finalvendor="${v.id}"><b>${v.id} · ${v.name}</b><small>${v.price} · ${v.quality} · ${v.delivery}</small></button>`).join('')}</div><label>⑦ 최종 판단근거</label><textarea id="teamReason">${esc(w.reason)}</textarea><div class="required-note ${String(w.reason).trim().length>=20?'ok':''}">20글자 이상 · 현재 ${String(w.reason).trim().length}/20자</div><button id="submitTeam" class="btn primary large full">나의 최종위원 의견 제출</button>`;}else{const sim=simAnswers();const report=A.team.report||{work:{issues:[],criteria:[],conflictResponse:0,twistResponse:0,vendor:t.finalVendor,reason:'납기와 이해관계를 포함한 기준을 적용해 변경사유를 기록했습니다.'}};const packets=Object.values(sim).map(answer=>({answer}));const ev=CHEONGRYEOM_EVALUATE_TEAM_REPORT(t,report,packets);h+=`<div class="demo-result-hero"><span class="eyebrow">TEAM PRACTICAL RESULT</span><h2>직무상황 종합평가 완료</h2><strong>${ev.score}</strong><p>팀 종합판단 점수</p></div>${scoreTable(ev,'T-01 종합평가 채점표')}<div class="demo-callout"><b>실제 수업에서는</b><br>모든 조원의 최종 판단을 집계해 팀 합의도와 개인 직무기여가 함께 반영됩니다. 서기만 제출하는 방식이 아닙니다.</div>`;}return h;}
function bindTeam(){const t=C.team;if(teamPhase===0){let a=A.team.role||{choice:null,work:{roleKey:'purchase',riskLevel:'',preliminaryVendor:'',note:'',question:''}};A.team.role=a;$$('[data-rolechoice]').forEach(b=>b.onclick=()=>{a.choice=Number(b.dataset.rolechoice);render()});$$('[data-risk]').forEach(b=>b.onclick=()=>{a.work.riskLevel=b.dataset.risk;render()});$$('[data-pre]').forEach(b=>b.onclick=()=>{a.work.preliminaryVendor=b.dataset.pre;render()});if($('#roleNote'))$('#roleNote').oninput=e=>a.work.note=e.target.value;if($('#roleQuestion'))$('#roleQuestion').oninput=e=>a.work.question=e.target.value;if($('#submitRole'))$('#submitRole').onclick=()=>{if(!roleReady()){alert('핵심정보·위험도·1차추천·근거·질문을 모두 작성해주세요.');return;}teamPhase=1;render();scrollTo(0,0)};}if(teamPhase===3){let r=A.team.report||{work:{issues:[],criteria:[],conflictResponse:null,twistResponse:null,vendor:'',influenceUid:'',reason:''}};A.team.report=r;const w=r.work;$$('[data-issue]').forEach(b=>b.onclick=()=>{const k=b.dataset.issue;w.issues=w.issues.includes(k)?w.issues.filter(x=>x!==k):[...w.issues,k];render()});$$('[data-tcrit]').forEach(b=>b.onclick=()=>{const k=b.dataset.tcrit;w.criteria=w.criteria.includes(k)?w.criteria.filter(x=>x!==k):[...w.criteria,k];render()});$$('[data-confresp]').forEach(b=>b.onclick=()=>{w.conflictResponse=Number(b.dataset.confresp);render()});$$('[data-twistresp]').forEach(b=>b.onclick=()=>{w.twistResponse=Number(b.dataset.twistresp);render()});$$('[data-influence]').forEach(b=>b.onclick=()=>{w.influenceUid=b.dataset.influence;render()});$$('[data-finalvendor]').forEach(b=>b.onclick=()=>{w.vendor=b.dataset.finalvendor;render()});if($('#teamReason'))$('#teamReason').oninput=e=>w.reason=e.target.value;if($('#submitTeam'))$('#submitTeam').onclick=()=>{if(w.issues.length<3||w.criteria.length<3||w.conflictResponse===null||w.twistResponse===null||!w.vendor||!w.influenceUid||String(w.reason).trim().length<20){alert('최종위원 판단 항목을 모두 완료해주세요.');return;}teamPhase=4;render();scrollTo(0,0)}}}
function comp(){const sums=Object.fromEntries(ROOT.virtues.map(v=>[v.key,{s:0,n:0}]));C.written.forEach(q=>{const a=A.written[q.id];if(!a)return;Object.entries(q.impact||{}).forEach(([k,v])=>{sums[k].s+=(a.choice===q.correct?v:Math.round(v*.3));sums[k].n++})});C.practical.forEach(q=>{const a=A.practical[q.id];if(!a)return;const ev=CHEONGRYEOM_EVALUATE_PRACTICAL(q,a);Object.entries(ev.impact||{}).forEach(([k,v])=>{if(sums[k]){sums[k].s+=v;sums[k].n++}})});if(A.team.role){const ev=CHEONGRYEOM_EVALUATE_TEAM_ROLE(C.team,A.team.role);Object.entries(ev.impact||{}).forEach(([k,v])=>{if(sums[k]){sums[k].s+=v;sums[k].n++}})}return Object.fromEntries(Object.entries(sums).map(([k,v])=>[k,v.n?Math.round(v.s/v.n):0]));}
function renderDiagnosis(){const vals=comp(),t=getCheongryeomType(vals);return `<span class="stage-tag">역량진단</span><h2>나의 청렴역량은 어떤 모양일까요?</h2><div class="student-context">점수는 나의 인격을 평가하는 값이 아니라 오늘 어떤 가치를 중심으로 판단했는지 돌아보기 위한 교육용 피드백입니다.</div><div class="student-comp">${ROOT.virtues.map(v=>`<div class="comp-row"><div class="comp-meta"><span>${v.name}</span><b>${vals[v.key]||0}</b></div><div class="comp-track"><span style="width:${vals[v.key]||0}%"></span></div></div>`).join('')}</div><section class="integrity-type-card"><div class="integrity-type-symbol">${t.symbol}</div><div class="integrity-type-body"><span class="integrity-type-kicker">6대 청렴역량 조합 진단</span><h3>나의 청렴유형 · ${t.name}</h3><div class="integrity-type-figure">상징 역사 인물 <b>${t.figure}</b></div><div class="integrity-type-top"><span>${t.primary.name} ${t.primary.score}</span><span>${t.secondary.name} ${t.secondary.score}</span></div><p>${t.summary}</p><div class="integrity-mission"><b>청렴ON 성장 미션</b><br>${t.mission}</div><small>※ 역사 인물 매칭은 청렴가치 이해를 돕기 위한 교육적 상징 연결입니다.</small></div></section>`}
function scoreSummary(){const S=ROOT.scoring;const wc=C.written.filter(q=>A.written[q.id]?.choice===q.correct).length;const w=Math.round(wc/C.written.length*100);const ps=C.practical.map(q=>A.practical[q.id]?CHEONGRYEOM_EVALUATE_PRACTICAL(q,A.practical[q.id]).score:0);const p=Math.round(ps.reduce((a,b)=>a+b,0)/3);const team=A.team.report?Math.max(78,CHEONGRYEOM_EVALUATE_TEAM_ROLE(C.team,A.team.role).score):78;const pl=A.pledge.trim().length>=10?100:0;const total=Math.round(w*.25+p*.45+team*.20+pl*.10);return {w,p,team,pl,total,q:total>=85&&p>=80&&team>=75?'청렴 리더':'청렴 서포터'};}
function renderPledge(){return `<span class="stage-tag">최종 미션</span><h2>나의 청렴 실천약속</h2><div class="student-context">내 전공의 미래 직업현장에서 실제로 지킬 수 있는 청렴·직업윤리 행동 한 가지를 구체적으로 적어주세요.</div><textarea id="pledgeText" maxlength="160" placeholder="예: 직무기준과 실제 기록이 다르면 편의보다 사실대로 보고하겠습니다.">${esc(A.pledge)}</textarea><div id="pledgeReq" class="required-note ${A.pledge.trim().length>=10?'ok':''}">※ 필수 · 10글자 이상 작성 · 현재 ${A.pledge.trim().length}/10자</div><button id="pledgeBtn" class="btn primary large full" ${A.pledge.trim().length>=10?'':'disabled'}>실천약속 서명</button>${A.pledge.trim().length>=10?'<div class="demo-submit-ok">✓ 실천약속이 준비되었습니다. 실제 수업에서는 서명 즉시 교사용 실시간 현황에 이름과 내용이 표시됩니다.</div>':''}`}
function bindPledge(){const t=$('#pledgeText'),b=$('#pledgeBtn'),r=$('#pledgeReq');t.oninput=()=>{A.pledge=t.value;const n=A.pledge.trim().length;b.disabled=n<10;r.classList.toggle('ok',n>=10);r.textContent=`※ 필수 · 10글자 이상 작성 · 현재 ${n}/10자`;};b.onclick=()=>{alert('실천약속 제출 완료 · 데모에서는 서버에 저장하지 않습니다.');render();}}
function renderResult(){const s=scoreSummary(),vals=comp(),t=getCheongryeomType(vals);return `<span class="stage-tag">자격판정</span><h2>평가가 종료되었습니다.</h2><div class="score-box"><div class="score-main"><span>종합 청렴역량 점수</span><strong>${s.total}</strong></div><div class="score-grid"><div><span>필기</span><b>${s.w}</b></div><div><span>개인 실기</span><b>${s.p}</b></div><div><span>종합평가</span><b>${s.team}</b></div><div><span>실천</span><b>${s.pl}</b></div></div></div><section class="integrity-type-card compact"><div class="integrity-type-symbol">${t.symbol}</div><div class="integrity-type-body"><span class="integrity-type-kicker">나의 청렴유형</span><h3>${t.name}</h3><div class="integrity-type-figure">상징 역사 인물 <b>${t.figure}</b></div><p>${t.summary}</p></div></section><div class="demo-certificate"><img src="assets/official/ci-education.png" alt="국가청렴권익교육원" style="max-height:45px"><small>교육용 청렴역량 인증 프로그램 · 심사위원 체험모드</small><h2>${s.q}</h2><div class="q">심사위원 체험</div><p>필기·개인 작업형 실기·전공맞춤 직무상황 종합평가를 통해<br>청렴의 지식·판단·협업·실천 과정을 체험하였습니다.</p><small>※ 실제 국가기술자격이 아닌 교육용 인증입니다.</small></div>`}
function render(){progress();let h='';if(stage==='intro')h=renderIntro();if(stage==='written')h=renderWritten();if(stage==='writtenFeedback')h=renderWrittenFeedback();if(stage==='practical')h=renderPractical();if(stage==='practicalFeedback')h=renderPracticalFeedback();if(stage==='team')h=renderTeam();if(stage==='diagnosis')h=renderDiagnosis();if(stage==='pledge')h=renderPledge();if(stage==='result')h=renderResult();$('#studentContent').innerHTML=h;let extra='';if(stage==='team'){if(teamPhase>0)extra='<button id="teamBack" class="btn outline">팀단계 ←</button>';if(teamPhase<4)extra+='<button id="teamNext" class="btn soft">팀단계 →</button>';}stageControls(extra);if(stage==='written')bindWritten();if(stage==='practical')bindPracticalOuter();if(stage==='team'){bindTeam();if($('#teamBack'))$('#teamBack').onclick=()=>{teamPhase=Math.max(0,teamPhase-1);render()};if($('#teamNext'))$('#teamNext').onclick=()=>{if(teamPhase===0&&!roleReady()){alert('먼저 개인 직무분석을 완료해주세요.');return;}teamPhase=Math.min(4,teamPhase+1);render();scrollTo(0,0)}}if(stage==='pledge')bindPledge();}
init();
</script>
