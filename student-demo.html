<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>청렴ON | 학생용 심사 데모</title>
<style>
:root{--blue:#075d8a;--deep:#173d54;--sky:#edf7fb;--line:#d5e2e9;--green:#168269;--orange:#ad6917;--red:#b73a3a;--bg:#f4f7f9;--scale:1}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#1d3948;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;word-break:keep-all;-webkit-text-size-adjust:100%}button,input,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:720px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:10px}.brand b{font-size:18px;color:var(--deep)}.brand span{font-size:11px;color:#6d7d86}.demo{margin-left:auto;font-size:11px;font-weight:800;background:#eaf6fb;color:var(--blue);padding:6px 8px;border-radius:999px}.zoom{max-width:720px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:7px;background:#f8fbfc;border-bottom:1px solid var(--line);font-size:12px}.zoom button{border:1px solid #cbdce4;background:white;border-radius:6px;padding:6px 9px;font-size:12px;font-weight:700}.zoom button.on{background:var(--blue);color:white;border-color:var(--blue)}.shell{max-width:720px;margin:auto;padding:14px}.progress{background:white;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}.pm{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:6px}.track{height:7px;background:#e7eef2;border-radius:99px;overflow:hidden}.track span{display:block;height:100%;background:#1591ba;transition:.2s}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:calc(17px * var(--scale));box-shadow:0 8px 24px rgba(25,55,73,.05);font-size:calc(14px * var(--scale))}.kicker{font-size:calc(11px * var(--scale));font-weight:900;color:var(--blue);letter-spacing:.04em}.card h1{font-size:calc(25px * var(--scale));line-height:1.35;margin:5px 0 10px;color:var(--deep)}.card h2{font-size:calc(20px * var(--scale));line-height:1.45;margin:5px 0 10px;color:var(--deep)}.card h3{font-size:calc(16px * var(--scale));margin:10px 0 7px}.card p,.card li{font-size:calc(13px * var(--scale));line-height:1.8}.helper{color:#647985}.section{border:1px solid #dbe6eb;border-radius:10px;padding:12px;margin:12px 0;background:#fbfdfe}.trackpick{display:grid;gap:8px}.trackbtn{width:100%;text-align:left;border:1px solid #ccdce4;background:#fff;border-radius:9px;padding:12px}.trackbtn b{display:block;font-size:calc(14px * var(--scale));color:#244e63}.trackbtn small{font-size:calc(11px * var(--scale));color:#75858d;line-height:1.6}.trackbtn.sel{border-color:#3d96ba;background:#edf8fc;box-shadow:0 0 0 2px rgba(61,150,186,.08)}.choicegrid{display:grid;gap:8px}.choice{border:1px solid #cfdee5;background:white;border-radius:9px;padding:11px;text-align:left;font-size:calc(13px * var(--scale));line-height:1.6}.choice.sel{background:#eaf7fc;border-color:#4ba1c2}.btn{border:0;border-radius:8px;padding:12px 14px;font-weight:900;font-size:calc(13px * var(--scale))}.primary{background:var(--blue);color:white}.outline{background:#fff;border:1px solid #cbdce4;color:#315a6f}.soft{background:#edf7fb;border:1px solid #cde3ed;color:var(--blue)}.full{width:100%}.nav{display:flex;gap:8px;margin-top:15px}.nav .btn{flex:1}.metricgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{border:1px solid #d7e5eb;border-radius:10px;padding:10px;background:#fff}.metric b{display:flex;justify-content:space-between;font-size:calc(13px * var(--scale))}.mtrack{height:7px;background:#e8eef1;border-radius:99px;overflow:hidden;margin-top:6px}.mtrack span{display:block;height:100%;background:#2b8db6}.feedback{border-left:4px solid var(--green);background:#f0f9f5;padding:11px 12px;margin:12px 0;border-radius:7px}.feedback.warn{border-left-color:var(--orange);background:#fff8ed}.feedback strong{display:block;margin-bottom:4px}.transition{background:#123f58;color:white;border-radius:12px;padding:15px;margin:13px 0}.transition b{font-size:calc(16px * var(--scale))}.transition p{margin:5px 0 0;color:#d8e8f0}.worktable{width:100%;border-collapse:collapse;font-size:calc(12px * var(--scale));margin:8px 0}.worktable th,.worktable td{border:1px solid #d7e3e9;padding:8px;text-align:left;vertical-align:top}.worktable th{background:#edf6fa;color:#315b70}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid #cedde4;background:white;border-radius:999px;padding:8px 10px;font-size:calc(12px * var(--scale));font-weight:750}.pill.sel{background:#eaf7fc;border-color:#4a9aba;color:#146e94}.speech{background:#eef8fd;border:1px solid #c4dfeb;border-radius:12px;padding:11px;margin:8px 0}.speech b{color:#0a6d98}.required{font-size:calc(11px * var(--scale));color:var(--orange);background:#fff7ec;border:1px solid #ecd0a9;padding:8px 10px;border-radius:7px;margin:7px 0}.required.ok{color:var(--green);background:#eef8f3;border-color:#baddcc}textarea{width:100%;min-height:82px;border:1px solid #c9dbe4;border-radius:8px;padding:10px;font-size:calc(13px * var(--scale));line-height:1.7}.team{display:grid;gap:8px}.member{border:1px solid #d7e4ea;border-radius:10px;padding:10px;background:#fff}.member b{color:#214d63}.member .line{font-size:calc(12px * var(--scale));line-height:1.7;margin-top:4px}.alert{background:#fff2e8;border:1px solid #efc9ac;border-radius:9px;padding:11px;color:#8c512b;margin:10px 0}.certificate{border:2px solid #c9a64f;background:#fffdf7;border-radius:12px;text-align:center;padding:18px;margin-top:12px}.certificate h2{font-size:calc(27px * var(--scale));color:#77570f}.badge{display:inline-block;background:#eaf6fb;color:var(--blue);padding:5px 7px;border-radius:999px;font-size:calc(10px * var(--scale));font-weight:900}.quick{font-size:11px;margin:8px 0 0;color:#6c7c84;text-align:center}@media(max-width:390px){.shell{padding:10px}.metricgrid{grid-template-columns:1fr}.worktable{font-size:calc(11px * var(--scale))}}
</style></head><body><header class="top"><div class="topin"><div class="brand"><b>청렴ON</b><br><span>특성화고 예비 직업인 직업윤리 자격과정</span></div><div class="demo">학생용 DEMO</div></div><div class="zoom"><span>화면 확대</span><button data-z="1" class="on">100%</button><button data-z="1.1">110%</button><button data-z="1.2">120%</button></div></header><main class="shell"><div class="progress"><div class="pm"><span id="stageName">수험등록</span><b id="pct">0%</b></div><div class="track"><span id="bar" style="width:0%"></span></div></div><article id="screen" class="card"></article></main>
<script>
const $=s=>document.querySelector(s);const tracks={industrial:{name:'산업기술·제조',icon:'⚙️',company:['A정밀','B테크','C메카'],p1:'외주가공 업체 선정',p2:'안전점검 기록 누락 처리',p3:'설비 안전개선안 평가',team:'긴급 외주가공 의사결정 회의'},digital:{name:'디지털·콘텐츠',icon:'💻',company:['A소프트','B디지털','C랩'],p1:'웹서비스 외주업체 선정',p2:'개인정보 접근기록 누락 처리',p3:'AI·콘텐츠 검수 개선안 평가',team:'고객앱 긴급배포 의사결정 회의'},business:{name:'경영·금융·공공',icon:'💼',company:['A오피스','B비즈','C문구'],p1:'공정한 구매업무',p2:'법인카드 증빙누락 처리',p3:'업무처리 개선안 평가',team:'긴급구매 의사결정 회의'},service:{name:'관광·생활서비스',icon:'🤝',company:['A푸드','B케이터링','C키친'],p1:'케이터링 업체 선정',p2:'알레르기 확인기록 누락 처리',p3:'고객응대 개선안 평가',team:'고객행사 케이터링 의사결정 회의'},life:{name:'농생명·식품·해양',icon:'🌱',company:['A팜','B푸드','C바이오'],p1:'원재료 공급업체 선정',p2:'냉장온도 기록 누락 처리',p3:'품질이력 개선안 평가',team:'원재료 긴급입고 의사결정 회의'}};
const steps=['join','orientation','written','writtenFeedback','p1','p2','p3','practicalFeedback','teamGuide','team','diagnosis','pledge','result'];const labels={join:'수험등록',orientation:'오리엔테이션',written:'필기평가',writtenFeedback:'필기 1차 피드백',p1:'작업형 실기 P-01',p2:'작업형 실기 P-02',p3:'작업형 실기 P-03',practicalFeedback:'실기 2차 피드백',teamGuide:'종합평가 안내',team:'직무상황 종합평가',diagnosis:'최종 역량진단',pledge:'청렴실천',result:'자격판정'};let step=0,state={track:'business',written:[null,null,null],p1:{conf:null,criteria:[],reason:''},p2:{order:[]},p3:{scores:[null,null,null],pressure:null},team:{final:null,twist:false},pledge:''};
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nav(dis=false){return `<div class="nav">${step?'<button class="btn outline" id="prev">← 이전</button>':''}<button class="btn primary" id="next" ${dis?'disabled':''}>${step===steps.length-1?'처음부터':'다음 →'}</button></div>`}function prog(){let p=Math.round(step/(steps.length-1)*100);$('#stageName').textContent=labels[steps[step]];$('#pct').textContent=p+'%';$('#bar').style.width=p+'%'}
function virtues(vals=[86,78,74,88,70,91]){let n=['정직','약속','배려','책임','절제','공정'];return `<div class="metricgrid">${n.map((x,i)=>`<div class="metric"><b><span>${x}</span><span>${vals[i]}</span></b><div class="mtrack"><span style="width:${vals[i]}%"></span></div></div>`).join('')}</div>`}
function render(){prog();let t=tracks[state.track],h='';if(steps[step]==='join'){h=`<span class="kicker">VOCATIONAL INTEGRITY QUALIFICATION</span><h1>예비 직업인의 전공에 맞는<br>청렴상황에 도전합니다.</h1><p class="helper"><b>내 학과와 가장 유사한 분야를 1개 선택하세요.</b><br>정확히 일치하지 않으면 배우는 내용과 취업 직무가 가장 가까운 분야를 선택하면 됩니다.</p><div class="trackpick">${Object.entries(tracks).map(([k,v])=>`<button class="trackbtn ${state.track===k?'sel':''}" data-track="${k}"><b>${v.icon} ${v.name}</b><small>${k==='industrial'?'기계 · 전기전자 · 자동차 · 반도체 · 건축건설':k==='digital'?'SW · AI · 정보통신 · 보안 · 게임 · 영상 · 디자인':k==='business'?'회계 · 세무 · 금융 · 경영 · 유통 · 행정':k==='service'?'관광 · 호텔 · 조리 · 제과제빵 · 미용 · 보건':'스마트팜 · 식품 · 산림 · 축산 · 수산 · 해양'}</small></button>`).join('')}</div><div class="section"><b>심사위원 체험자</b><p>실제 수업에서는 학생 이름과 6자리 수업코드로 수험등록합니다. 데모에서는 개인정보를 입력하지 않습니다.</p></div>${nav()}`}
if(steps[step]==='orientation'){h=`<span class="kicker">ORIENTATION</span><h2>${t.icon} ${t.name} 직업윤리 오리엔테이션</h2><p>청렴은 지식만으로 취득할 수 없는 자격입니다. 미래 직무에서 필요한 6대 청렴역량을 확인합니다.</p>${virtues([75,75,75,75,75,75])}<div class="transition"><b>필기에서는 ‘판단’을 확인합니다.</b><p>상황을 읽고 보기 중 가장 적절한 직업윤리 판단을 선택합니다.</p></div>${nav()}`}
if(steps[step]==='written'){let qs=[`현장실습 중 ${t.name} 업무기록에서 실제 수치와 다른 내용을 발견했다. 가장 적절한 행동은?`,`친한 선배가 규정상 필요한 확인절차를 이번만 생략해 달라고 한다. 어떻게 할까?`,`일정을 맞추기 위해 품질·안전 또는 개인정보 확인을 줄이자는 의견이 나왔다. 가장 적절한 판단은?`];h=`<span class="kicker">WRITTEN TEST</span><h2>전공맞춤 필기 · 대표 3문항</h2>${qs.map((q,i)=>`<div class="section"><b>문항 ${i+1}</b><p>${q}</p><div class="choicegrid">${['편의를 위해 그대로 진행한다.','사실과 규정을 확인하고 필요한 보고·기록을 남긴다.','문제가 생기면 나중에 정정한다.'].map((o,j)=>`<button class="choice ${state.written[i]===j?'sel':''}" data-w="${i}:${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div></div>`).join('')}<div class="required ${state.written.every(x=>x!==null)?'ok':''}">대표 문항에 모두 응답하면 필기 피드백으로 이동합니다.</div>${nav(!state.written.every(x=>x!==null))}`}
if(steps[step]==='writtenFeedback'){h=`<span class="kicker">WRITTEN FEEDBACK</span><h2>필기평가 완료 · 1차 피드백</h2><p>필기는 끝났습니다. 이제 <b>직접 처리하는 작업형 실기</b>로 넘어갑니다.</p>${virtues([86,82,73,84,68,91])}<div class="feedback"><strong>✓ 잘하고 있어요 · 공정 91 / 정직 86</strong>공개된 기준과 사실을 확인해 판단하는 힘이 안정적으로 나타났습니다.</div><div class="feedback warn"><strong>→ 실기에서 더 연습해볼 점 · 절제 68</strong>친분·편의·압박과 직무판단을 분리하는 연습을 해보세요.</div><div class="transition"><b>필기 → 실기, 평가 방식이 바뀝니다.</b><p>지급자료 확인 → 기준 설정 → 실제 처리 → 기록 제출의 순서로 수행합니다.</p></div>${nav()}`}
if(steps[step]==='p1'){let c=t.company;let ok=state.p1.conf&&state.p1.criteria.length>=2&&state.p1.reason.trim().length>=10;h=`<span class="kicker">PRACTICAL P-01</span><h2>${t.p1}</h2><p>세 대안을 실제 직무기준으로 비교해 최종 처리안을 만드세요.</p><table class="worktable"><tr><th>대안</th><th>가격/효율</th><th>품질·안전</th><th>납기</th><th>이해관계</th></tr><tr><td>${c[0]}</td><td>보통</td><td>적합</td><td>충족</td><td>없음</td></tr><tr><td>${c[1]}</td><td>우수</td><td>우수</td><td>충족</td><td>없음</td></tr><tr><td>${c[2]}</td><td>보통</td><td>우수</td><td>충족</td><td>지인 관계</td></tr></table><h3>② 이해관계 확인</h3><div class="pills">${[...c,'없음'].map(x=>`<button class="pill ${state.p1.conf===x?'sel':''}" data-conf="${x}">${x}</button>`).join('')}</div><h3>③ 비교기준 2개 이상</h3><div class="pills">${['가격·효율','품질·안전','납기','이해관계'].map(x=>`<button class="pill ${state.p1.criteria.includes(x)?'sel':''}" data-crit="${x}">${x}</button>`).join('')}</div><h3>선정이유 및 처리기록</h3><div class="required ${state.p1.reason.trim().length>=10?'ok':''}">10글자 이상 · 현재 ${state.p1.reason.trim().length}/10자</div><textarea id="p1txt" placeholder="비교기준과 이해관계 처리방식을 함께 적어보세요.">${esc(state.p1.reason)}</textarea>${nav(!ok)}`}
if(steps[step]==='p2'){let correct=['사실관계 확인','증빙·기록 재확인','담당자 보고','실제 내용대로 조치'];h=`<span class="kicker">PRACTICAL P-02</span><h2>${t.p2}</h2><p>누락·오류를 발견한 뒤 올바른 업무처리 순서를 구성합니다.</p><div class="pills">${[...correct,'다른 기록에 섞어 맞추기','누락된 채 종결'].map(x=>`<button class="pill ${state.p2.order.includes(x)?'sel':''}" data-order="${x}">${x}</button>`).join('')}</div><div class="section"><b>내 처리순서</b><p>${state.p2.order.length?state.p2.order.map((x,i)=>(i+1)+'. '+x).join('<br>'):'위 카드에서 4개를 순서대로 선택하세요.'}</p></div>${nav(state.p2.order.length<4)}`}
if(steps[step]==='p3'){let opts=[['A안','핵심 절차는 간단하지만 기록 항목이 적음'],['B안','현장 실행성이 높으나 예외처리 기준이 부족'],['C안','공개기준·변경이력·재검증 절차까지 포함']];h=`<span class="kicker">PRACTICAL P-03</span><h2>${t.p3}</h2><p>채용이 아니라 <b>현장에서 사용할 개선안</b>을 평가합니다. 발표까지 듣고 직접 점수를 부여한 뒤 추가 압력 속에서도 기준을 유지하는지 확인합니다.</p>${opts.map((o,i)=>`<div class="section"><b>${o[0]}</b><p>${o[1]}</p><div class="speech"><b>🎤 발표</b><p>${i===0?'“절차를 단순화해 현장 속도를 높이겠습니다.”':i===1?'“실행 가능한 수준에서 기록과 검증을 병행하겠습니다.”':'“누가 수행해도 같은 기준을 적용하고 변경이력과 재검증 결과를 남기겠습니다.”'}</p></div><div class="pills">${[6,7,8,9,10].map(n=>`<button class="pill ${state.p3.scores[i]===n?'sel':''}" data-score="${i}:${n}">${n}점</button>`).join('')}</div></div>`).join('')}<div class="alert"><b>추가정보</b><br>현장 책임자가 C안을 선호하며 “이번에는 C안으로 맞추자”고 압박합니다.</div><div class="pills"><button class="pill ${state.p3.pressure===0?'sel':''}" data-pressure="0">선호 사실은 기록하되 기존 기준 유지</button><button class="pill ${state.p3.pressure===1?'sel':''}" data-pressure="1">책임자의 선호에 맞춰 점수 조정</button></div>${nav(!(state.p3.scores.every(x=>x!==null)&&state.p3.pressure!==null))}`}
if(steps[step]==='practicalFeedback'){h=`<span class="kicker">PRACTICAL FEEDBACK</span><h2>작업형 실기 완료 · 2차 피드백</h2><div class="section"><b>실기 평균 87점</b><p>P-01 88점 · P-02 92점 · P-03 81점</p></div>${virtues([89,84,77,91,74,93])}<div class="feedback"><strong>✓ 실기에서 잘하고 있어요 · 공정 93 / 책임 91</strong>자료를 확인하고 기준에 따라 업무처리를 완성하는 힘이 강점입니다.</div><div class="feedback warn"><strong>→ 종합평가에서 더 해볼 점 · 배려 77</strong>내 직무만 보지 말고 다른 부서·고객·사용자에게 미치는 영향까지 함께 비교해보세요.</div>${nav()}`}
if(steps[step]==='teamGuide'){h=`<span class="kicker">TEAM PRACTICAL GUIDE</span><h2>다음 평가 · 전공맞춤 직무상황 종합평가</h2><div class="transition"><b>이번에는 혼자 정답을 찾는 문제가 아닙니다.</b><p>각자 다른 직무정보를 분석하고 디지털 상황판에서 서로의 판단을 합쳐 최종 결정을 만듭니다.</p></div><div class="section"><b>① 팀·역할 확인</b><p>같은 전공 3~5명 중심 랜덤팀. 부족 역할은 겸임자료로 자동 보완.</p><b>② 내 직무 분석</b><p>핵심정보·위험도·1차 추천·근거·확인질문 제출.</p><b>③ 팀 상황판 교차검증</b><p>자리 이동 없이 조원들의 판단이 휴대폰에 자동 공유.</p><b>④ 돌발상황 재판단</b><p>새로운 조건이 공개되면 처음 판단을 다시 검토.</p><b>⑤ 전원 최종의견 제출</b><p>서기 한 명이 대신 쓰지 않고 모든 조원이 직접 최종 판단과 근거 제출.</p></div><div class="feedback"><strong>📱 자리 이동은 필요 없습니다.</strong>교사가 단계별 화면을 열면 같은 팀 정보가 각자의 휴대폰에 자동 공유됩니다.</div>${nav()}`}
if(steps[step]==='team'){h=`<span class="kicker">TEAM PRACTICAL</span><h2>${t.team}</h2><span class="badge">시연용 가상 조원</span><p>실제 수업에서는 랜덤 편성된 같은 팀 학생의 이름·역할·근거·확인질문이 실시간으로 표시됩니다.</p><div class="team"><div class="member"><b>김도윤 · 회계/비용 담당</b><div class="line">위험도: 보통 · 1차 추천: ${t.company[1]}<br><b>근거:</b> 예산 범위 내에서는 가격만이 아니라 품질과 납기를 함께 봐야 합니다.<br><b>확인질문:</b> 운영 담당에게 필수 납기시각을 확인하고 싶습니다.</div></div><div class="member"><b>이서현 · 품질/검증 담당</b><div class="line">위험도: 높음 · 1차 추천: ${t.company[1]}<br><b>근거:</b> 품질은 B안이 우수하지만 이해관계와 검증기록이 필요합니다.<br><b>확인질문:</b> 기록 담당에게 이해관계 공개 여부를 확인합니다.</div></div><div class="member"><b>박민준 · 업무운영 담당</b><div class="line">위험도: 높음 · 1차 추천: ${t.company[0]}<br><b>근거:</b> 업무 시작 전 납품 완료가 필수조건입니다.<br><b>확인질문:</b> B안의 실제 납기시간을 다시 확인해야 합니다.</div></div><div class="member"><b>심사위원 체험자 · 기록·검증 담당</b><div class="line">내 역할: 규정·이해관계·의사결정 기록 검증</div></div></div>${state.team.twist?`<div class="alert"><b>⚠ 돌발상황</b><br>${t.company[1]}의 납기·배포·입고 시간이 필수 기준 이후로 변경되었습니다.</div>`:`<button class="btn soft full" id="twist">③ 돌발상황 공개</button>`}${state.team.twist?`<h3>④ 전원 최종판단</h3><div class="pills">${t.company.map(x=>`<button class="pill ${state.team.final===x?'sel':''}" data-final="${x}">${x}</button>`).join('')}</div><p class="helper">다른 조원의 근거와 돌발상황을 함께 반영해 최종 판단을 제출합니다.</p>`:''}${state.team.twist?nav(!state.team.final):''}`}
if(steps[step]==='diagnosis'){h=`<span class="kicker">FINAL DIAGNOSIS</span><h2>최종 6대 청렴역량</h2>${virtues([91,86,83,94,79,95])}<div class="feedback"><strong>최종 강점 · 공정 95 / 책임 94</strong>공개된 기준을 유지하면서 업무 결과를 끝까지 기록·조치하는 역량이 높게 나타났습니다.</div><div class="section"><span class="badge">6대 청렴역량 조합 진단</span><h3>공정리더형 · 정약용</h3><p>합리적이고 공정한 기준으로 문제를 해결하며 맡은 책임을 끝까지 수행하는 유형입니다.</p><small>※ 역사인물 연결은 청렴가치 이해를 돕기 위한 교육적 상징입니다.</small></div>${nav()}`}
if(steps[step]==='pledge'){let ok=state.pledge.trim().length>=10;h=`<span class="kicker">INTEGRITY PLEDGE</span><h2>나의 직업윤리 실천약속</h2><p>미래 직업현장에서 실제로 지킬 행동을 한 문장으로 남깁니다.</p><textarea id="pledge" placeholder="예: 친분보다 공개된 기준을 우선하고, 문제를 발견하면 사실대로 기록하고 보고하겠습니다.">${esc(state.pledge)}</textarea><div class="required ${ok?'ok':''}">10글자 이상 · 현재 ${state.pledge.trim().length}/10자</div>${nav(!ok)}`}
if(steps[step]==='result'){h=`<span class="kicker">QUALIFICATION RESULT</span><h2>청렴ON 전 과정을 완료했습니다.</h2><div class="section"><b>종합점수 91점</b><p>필기 88 · 개인 작업형 실기 87 · 종합평가 94 · 실천서약 100</p></div><div class="certificate"><small>교육용 청렴역량 인증 프로그램</small><h2>청렴 리더</h2><b>심사위원 체험자</b><p>${t.icon} ${t.name}<br>기술을 갖춘 사람에서, 신뢰받는 직업인으로.</p></div><p class="quick">※ 본 인증은 실제 국가기술자격이 아닌 교육용 인증입니다.</p>${nav()}`}
$('#screen').innerHTML=h;bind()}
function bind(){document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{state.track=b.dataset.track;render()});document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.w.split(':').map(Number);state.written[i]=j;render()});document.querySelectorAll('[data-conf]').forEach(b=>b.onclick=()=>{state.p1.conf=b.dataset.conf;render()});document.querySelectorAll('[data-crit]').forEach(b=>b.onclick=()=>{let x=b.dataset.crit;state.p1.criteria=state.p1.criteria.includes(x)?state.p1.criteria.filter(v=>v!==x):[...state.p1.criteria,x];render()});if($('#p1txt'))$('#p1txt').oninput=e=>{state.p1.reason=e.target.value;render()};document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{let x=b.dataset.order;if(state.p2.order.length<4&&!state.p2.order.includes(x)){state.p2.order.push(x);render()}});document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{let [i,n]=b.dataset.score.split(':').map(Number);state.p3.scores[i]=n;render()});document.querySelectorAll('[data-pressure]').forEach(b=>b.onclick=()=>{state.p3.pressure=Number(b.dataset.pressure);render()});if($('#twist'))$('#twist').onclick=()=>{state.team.twist=true;render()};document.querySelectorAll('[data-final]').forEach(b=>b.onclick=()=>{state.team.final=b.dataset.final;render()});if($('#pledge'))$('#pledge').oninput=e=>{state.pledge=e.target.value;render()};if($('#prev'))$('#prev').onclick=()=>{step--;render();scrollTo(0,0)};if($('#next'))$('#next').onclick=()=>{if(step===steps.length-1){step=0;state={track:state.track,written:[null,null,null],p1:{conf:null,criteria:[],reason:''},p2:{order:[]},p3:{scores:[null,null,null],pressure:null},team:{final:null,twist:false},pledge:''}}else step++;render();scrollTo(0,0)}}document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{document.documentElement.style.setProperty('--scale',b.dataset.z);document.querySelectorAll('[data-z]').forEach(x=>x.classList.toggle('on',x===b))});render();
</script></body></html>
